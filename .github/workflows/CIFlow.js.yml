# Script does our entire CI workflow, both unit testing and E2E testing

name: CI Flow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [latest]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install, downloads existing dependencies, but not any new  
      run: npm ci
    - name: Performs unit tests
      run: npx vitest run
    - name: Builds website  
      run: npm run build 
    - name: Installs playwright browser
      run: npx playwright install --with-deps
    - name: Run playwright test
      run: npx playwright test
    
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 10
